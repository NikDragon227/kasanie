# Bugsink — self-hosted трекинг ошибок (Sentry-совместимый протокол).
#
# Поднять на проде:
#   docker compose -f compose.yaml -f compose.production.yaml -f compose.bugsink.yaml up -d bugsink
#
# Дашборд слушает только 127.0.0.1 — открывать по SSH-туннелю:
#   ssh -L 8000:localhost:8000 root@45.136.205.93
#   затем в браузере: http://localhost:8000  (логин из BUGSINK_SUPERUSER)
#
# В .env задать:
#   BUGSINK_SECRET_KEY=<длинная случайная строка>
#   BUGSINK_SUPERUSER=admin@prokasanie.ru:<пароль>
#
# После создания проекта в Bugsink он покажет DSN вида
#   http://KEY@localhost:8000/1
# В .env вписать его, ЗАМЕНИВ host на имя сервиса:
#   SENTRY_DSN=http://KEY@bugsink:8000/1
# и пересоздать api. Фронт (VITE_SENTRY_DSN) пока не трогаем — для него нужен
# публичный ingest-endpoint (сделаем поддоменом позже).

services:
  bugsink:
    image: bugsink/bugsink:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bugsink_data:/data
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?set BUGSINK_SECRET_KEY in .env}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER:?set BUGSINK_SUPERUSER=email:password in .env}
      BASE_URL: http://localhost:8000
      BEHIND_HTTPS_PROXY: "false"
      DATABASE_URL: sqlite:////data/bugsink.sqlite3
      PORT: "8000"

volumes:
  bugsink_data:
