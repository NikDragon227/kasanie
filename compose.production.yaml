services:
  db:
    restart: unless-stopped
    expose: ["5432"]
  api:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CookieSecure: "true"
    expose: ["8080"]
  web:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/certs:/etc/nginx/certs:ro
