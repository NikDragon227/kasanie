upstream kasanie_api { server api:8080; }

server {
    listen 80;
    server_name _;
    location = /health { proxy_pass http://kasanie_api/health; }
    location = /health/live { proxy_pass http://kasanie_api/health/live; }
    location = /health/ready { proxy_pass http://kasanie_api/health/ready; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://*.taxi.yandex.net; worker-src 'self' data: blob: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; child-src https://api-maps.yandex.ru; frame-src https://api-maps.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { proxy_pass http://kasanie_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 1m; }
    location = /health { proxy_pass http://kasanie_api/health; }
    location = /health/live { proxy_pass http://kasanie_api/health/live; }
    location = /health/ready { proxy_pass http://kasanie_api/health/ready; }
    location / { try_files $uri $uri/ /index.html; }
}
